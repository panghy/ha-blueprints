blueprint:
  name: HVAC Toggle Thermostat
  description: >-
    Thermostat control for rooms with a physical toggle-based HVAC system using
    a Fingerbot (via Adaprox BLE gateway) to press the AC remote's power button.
    Decides WHEN to press; it does NOT write the cooling state boolean. Press
    bookkeeping (toggling cooling_active + snapshotting temp_at_toggle) lives
    in the companion HVAC Press Listener automation, which reacts to the
    gateway status sensor's press-feedback blip whenever it arrives — blip
    latency is unbounded (observed 6s to 8.6 minutes), so bookkeeping tied to
    this automation's run would lose late blips and desync the belief state.
    A press is only issued when the gateway status is idle ('01') and the
    relevant cooldown timer is idle (ON presses gate on the cooldown timer;
    OFF presses gate on the optional off-cooldown timer when configured,
    enabling a shorter post-on minimum run); there is no in-run retry (with
    unbounded latency a timeout cannot distinguish a lost press from a late
    one), so the cooldown — which must exceed typical blip latency — is the
    only re-press throttle, and the outer loop provides lost-press recovery.
    Evaluation is reactive, not polled: triggers fire on temperature and
    target changes, on cooldown/off-cooldown timer.finished events, on the
    cooling belief dwelling long enough to release the min-run and
    reconciliation gates, and on the mode selector returning to Cooling —
    plus a 15-minute time_pattern safety net bounding staleness after
    restarts or missed events. Overlapping triggers are harmless (mode
    restart + idempotent conditions).
  domain: automation
  source_url: https://github.com/panghy/ha-blueprints/blob/main/hvac_toggle_thermostat.yaml
  input:
    room_settings:
      name: Room Settings
      description: Core entities for this room's HVAC control.
      collapsed: false
      input:
        temp_sensor:
          name: Temperature Sensor
          description: The room temperature sensor entity.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        target_temp:
          name: Target Temperature
          description: An input_number helper that holds the desired room temperature.
          selector:
            entity:
              filter:
                - domain: input_number
        cooling_active:
          name: Cooling Active Boolean
          description: An input_boolean helper that tracks whether we believe the AC is currently on.
          selector:
            entity:
              filter:
                - domain: input_boolean
        temp_at_toggle:
          name: Temperature at Toggle
          description: An input_number helper that stores the temperature when the toggle was last pressed.
          selector:
            entity:
              filter:
                - domain: input_number
        cooldown_timer:
          name: Cooldown Timer
          description: >-
            A timer helper used to prevent rapid toggling after a press. Gates
            ON presses (and reconciliation); also gates OFF presses unless a
            separate Off Cooldown Timer is configured below.
          selector:
            entity:
              filter:
                - domain: timer
        off_cooldown_timer:
          name: Off Cooldown Timer (optional)
          description: >-
            Optional separate timer helper gating OFF presses only. When set,
            an ON press starts it with Post-On Cooldown Duration (the
            minimum compressor run time) and an OFF press starts it with
            Cooldown Duration (duplicate-OFF blip cover), letting the OFF
            press land earlier than the full cooldown without weakening
            duplicate-press protection. When left empty, OFF presses gate on
            the shared Cooldown Timer exactly as before. Create the helper
            with Restore enabled so an HA restart does not drop the running
            gate. CAUTION: if this entity is deleted or unavailable the OFF
            gate never reads idle — OFF presses are blocked (fail-frozen-ON)
            while ON presses keep working; the Drift Watchdog is the
            backstop, but fix the entity. On the first evaluation after
            opting in, this timer is idle regardless of a recent ON press
            (one-time migration window; the belief-anchored min-run check
            still applies).
          default: ""
          selector:
            entity:
              filter:
                - domain: timer
        hvac_mode_select:
          name: HVAC Mode Selector
          description: An input_select that indicates the current house HVAC mode (must include "Cooling").
          selector:
            entity:
              filter:
                - domain: input_select
    adaprox_gateway:
      name: Adaprox Gateway
      description: >-
        Entities from the Adaprox BLE gateway that controls the Fingerbot.
        The gateway exposes per-slot entities: Connect (BLE connection switch,
        deprecated here), Switch (Fingerbot toggle command), and Status (the
        slot's press-feedback sensor, used to verify presses).
      collapsed: false
      input:
        gateway_connect:
          name: Gateway Connect (deprecated)
          description: >-
            DEPRECATED — no longer used. The blueprint now toggles the gateway
            switch directly without a BLE connect step. Kept only so existing
            automations that still supply this input keep validating.
          default: ""
          selector:
            entity:
              filter:
                - domain: switch
        gateway_switch:
          name: Gateway Switch
          description: >-
            The Adaprox gateway's "Switch" entity. This sends the actual toggle
            command to the Fingerbot to press the AC power button.
          selector:
            entity:
              filter:
                - domain: switch
        gateway_status:
          name: Gateway Status
          description: >-
            The Adaprox gateway's "Status" sensor for this Fingerbot's slot.
            A press is only issued while this sensor reads '01' (not mid-blip
            or '00' BLE-dropped). The companion Press Listener automation on
            this same sensor owns the press bookkeeping. Must be the Status
            sensor for this Fingerbot's own slot.
          selector:
            entity:
              filter:
                - domain: sensor
    tuning:
      name: Tuning Parameters
      description: Adjust thresholds and timing to suit your room.
      collapsed: true
      input:
        upper_offset:
          name: Upper Temperature Offset
          description: >-
            How many degrees above the target temperature before turning on
            cooling. For example, 0.3 means cooling turns on at target + 0.3°C.
          default: 0.3
          selector:
            number:
              min: 0.1
              max: 2.0
              step: 0.1
              unit_of_measurement: "°C"
        lower_offset:
          name: Lower Temperature Offset
          description: >-
            How many degrees below the target temperature before turning off
            cooling. For example, 0.2 means cooling turns off at target - 0.2°C.
          default: 0.2
          selector:
            number:
              min: 0.1
              max: 2.0
              step: 0.1
              unit_of_measurement: "°C"
        cooldown_minutes:
          name: Cooldown Duration
          description: >-
            Minutes to wait after pressing the toggle before allowing another
            press. This is the only re-press throttle, so it must exceed the
            gateway's typical blip delivery latency (observed up to ~9
            minutes): a shorter cooldown lets the loop re-press while a
            previous press is still queued at the gateway, physically
            toggling the AC back and forth.
          default: 10
          selector:
            number:
              min: 1
              max: 15
              step: 1
              unit_of_measurement: minutes
        post_on_cooldown_minutes:
          name: Post-On Cooldown Duration
          description: >-
            Only used when an Off Cooldown Timer is configured: minutes after
            an ON press before an OFF press is allowed (the minimum compressor
            run time). Values below 5 minutes give the compressor very short
            runs — do not go lower without a reason. Duplicate-press
            protection is NOT weakened by this value: an OFF press is only
            possible once the press listener has confirmed the ON blip, and
            re-pressing OFF is still blocked for the full Cooldown Duration.
          default: 10
          selector:
            number:
              min: 1
              max: 15
              step: 1
              unit_of_measurement: minutes
        reconciliation_minutes:
          name: Reconciliation Wait
          description: >-
            Minutes to wait before reconciliation checks if the AC state matches
            expectations based on temperature change since last toggle.
          default: 10
          selector:
            number:
              min: 5
              max: 30
              step: 1
              unit_of_measurement: minutes
        reconciliation_drop:
          name: Reconciliation Drop Threshold
          description: >-
            If cooling_active is off but the temperature has dropped by more than
            this amount since the last toggle, assume the AC is actually running.
          default: 1.0
          selector:
            number:
              min: 0.5
              max: 3.0
              step: 0.1
              unit_of_measurement: "°C"
        reconciliation_rise:
          name: Reconciliation Rise Threshold
          description: >-
            If cooling_active is on but the temperature has risen by at least
            this amount above the last-toggle snapshot, assume the AC is
            actually off. A margin of 0 (the old behavior) fires on any
            non-negative change, which cannot distinguish a genuinely-off AC
            from a running one merely losing to heat load (near-zero cooling
            rate): with a 0.1 °C-resolution sensor, flat-load readings sit
            0.0–0.3 above the snapshot and falsely flip the belief off — the
            next loop press then physically turns the running AC OFF,
            inverting polarity. Sized from listener-era history (Aug 18–19):
            false positives peaked at +0.3 while every genuine desync showed
            +0.4 to +1.6 at detection time, so 0.4 suppresses all observed
            false flips with zero added delay on the genuine ones. Raising it
            further delays recovery from real stuck-off desyncs (the room
            must warm that much past the snapshot before correction).
          default: 0.4
          selector:
            number:
              min: 0.0
              max: 2.0
              step: 0.1
              unit_of_measurement: "°C"

variables:
  temp_sensor_id: !input temp_sensor
  target_temp_id: !input target_temp
  cooling_active_id: !input cooling_active
  temp_at_toggle_id: !input temp_at_toggle
  cooldown_timer_id: !input cooldown_timer
  off_cooldown_timer_id: !input off_cooldown_timer
  off_gate_id: >-
    {{ off_cooldown_timer_id if off_cooldown_timer_id else cooldown_timer_id }}
  gateway_connect_id: !input gateway_connect
  gateway_switch_id: !input gateway_switch
  gateway_status_id: !input gateway_status
  upper_offset: !input upper_offset
  lower_offset: !input lower_offset
  cooldown_minutes: !input cooldown_minutes
  post_on_cooldown_minutes: !input post_on_cooldown_minutes
  reconciliation_minutes: !input reconciliation_minutes
  reconciliation_drop: !input reconciliation_drop
  reconciliation_rise: !input reconciliation_rise
  current_temp: "{{ states(temp_sensor_id) | float(15) }}"
  target: "{{ states(target_temp_id) | float(22) }}"
  toggle_temp: "{{ states(temp_at_toggle_id) | float(15) }}"
  temp_available: "{{ states(temp_sensor_id) not in ['unknown', 'unavailable'] }}"
  target_available: "{{ states(target_temp_id) not in ['unknown', 'unavailable'] }}"
  toggle_temp_available: "{{ states(temp_at_toggle_id) not in ['unknown', 'unavailable'] }}"

triggers:
  # Reactive evaluation: fire on every input the conditions read, so
  # decisions land within seconds of the change instead of on the next
  # minute boundary. Triggers may overlap (e.g. both cooling_active dwell
  # triggers); that is harmless — mode: restart plus idempotent conditions
  # make extra evaluations no-ops.

  # ON/OFF threshold crossings + reconciliation temperature comparisons.
  - trigger: state
    entity_id: !input temp_sensor
  # Schedules and idle/away setbacks moving the target.
  - trigger: state
    entity_id: !input target_temp
  # ON-press / reconciliation gate opening.
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input cooldown_timer
  # OFF gate opening. When the optional off-cooldown timer is left empty
  # this filter is entity_id '' and simply never matches (timer.finished
  # events always carry a real entity_id) — the OFF branch then gates on
  # the shared cooldown timer, whose finished event triggers above.
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input off_cooldown_timer
  # Belief-anchored minimum-run guard releasing (OFF branch).
  - trigger: state
    entity_id: !input cooling_active
    to: "on"
    for:
      minutes: !input post_on_cooldown_minutes
  # Reconciliation dwell elapsing (both directions).
  - trigger: state
    entity_id: !input cooling_active
    to:
      - "on"
      - "off"
    for:
      minutes: !input reconciliation_minutes
  # Control resuming when the house flips back into Cooling mode.
  - trigger: state
    entity_id: !input hvac_mode_select
    to: Cooling
  # Safety net: bounds staleness after HA restarts or missed events
  # (e.g. a timer.finished that fired while automations were reloading).
  - trigger: time_pattern
    minutes: /15

conditions:
  - condition: state
    entity_id: !input hvac_mode_select
    state:
      - Cooling

actions:
  # The cooldown gate is per-branch rather than automation-wide:
  # reconciliation and the ON branch gate on the shared cooldown timer;
  # the OFF branch gates on the off-cooldown timer when one is configured
  # (falling back to the shared timer otherwise, preserving the original
  # symmetric behavior for rooms that don't opt in).

  # Reconciliation: we think cooling is on but the temp has RISEN past the
  # snapshot by the rise margin. A bare >= snapshot comparison (rise 0)
  # cannot tell a genuinely-off AC from a running one losing to heat load,
  # and a false flip here makes the next loop press turn the running AC
  # physically OFF (polarity inversion) — see reconciliation_rise.
  - if:
      - condition: state
        entity_id: !input cooldown_timer
        state: idle
      - condition: state
        entity_id: !input cooling_active
        state: "on"
        for:
          minutes: !input reconciliation_minutes
      - condition: template
        value_template: >-
          {{ temp_available and toggle_temp_available
          and (current_temp - toggle_temp) | round(1) >= reconciliation_rise }}
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: !input cooling_active
      - stop: ""

  # Reconciliation: we think cooling is off but temp dropped significantly
  - if:
      - condition: state
        entity_id: !input cooldown_timer
        state: idle
      - condition: state
        entity_id: !input cooling_active
        state: "off"
        for:
          minutes: !input reconciliation_minutes
      - condition: template
        value_template: >-
          {{ temp_available and toggle_temp_available
          and current_temp <= (toggle_temp - reconciliation_drop) }}
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: !input cooling_active
      - stop: ""

  # Control: too hot, turn on cooling
  - if:
      - condition: state
        entity_id: !input cooldown_timer
        state: idle
      - condition: template
        value_template: >-
          {{ temp_available and target_available
          and current_temp > (target + upper_offset) }}
      - condition: state
        entity_id: !input cooling_active
        state: "off"
    then:
      # Skip pressing while the slot is showing a blip or a '00' BLE drop.
      # NOTE: this does NOT detect a queued-but-undelivered press (the
      # sensor reads '01' while a command is in flight); the cooldown timer
      # is the real re-press throttle, so its duration must cover typical
      # blip latency (see cooldown_minutes).
      - if:
          - condition: template
            value_template: "{{ states(gateway_status_id) != '01' }}"
        then:
          - stop: Gateway not idle; skipping press
      # Press the AC power button via Fingerbot. Bookkeeping (cooling_active
      # + temp_at_toggle) is NOT written here: the Press Listener automation
      # toggles them when the status blip arrives, however late, so even a
      # duplicate press self-reports as two toggles instead of silently
      # corrupting the belief state. There is no in-run retry: with
      # unbounded blip latency a timeout cannot distinguish a lost press
      # from a late one, and a retry on a late press double-toggles. A
      # genuinely lost press is recovered by the outer loop (next evaluation
      # after cooldown still sees the temperature out of range and the
      # belief unchanged) and surfaced by the Drift Watchdog.
      - action: switch.toggle
        target:
          entity_id: !input gateway_switch
      # Start the cooldown: blocks re-pressing ON (and reconciliation)
      # until it expires.
      - action: timer.start
        target:
          entity_id: !input cooldown_timer
        data:
          duration:
            minutes: "{{ cooldown_minutes | int }}"
      # If a separate off-cooldown timer is configured, start it with the
      # post-on duration: this is the minimum compressor run time before an
      # OFF press is allowed. Duplicate-press safety is unaffected — the OFF
      # branch also requires cooling_active 'on', which only the Press
      # Listener sets once this ON press's blip is confirmed.
      - if:
          - condition: template
            value_template: "{{ off_cooldown_timer_id != '' }}"
        then:
          - action: timer.start
            target:
              entity_id: "{{ off_cooldown_timer_id }}"
            data:
              duration:
                minutes: "{{ post_on_cooldown_minutes | int }}"
      - stop: ""

  # Control: cool enough, turn off cooling
  - if:
      - condition: template
        value_template: "{{ states(off_gate_id) == 'idle' }}"
      # Belief-anchored minimum run (opt-in rooms only): the off-cooldown
      # timer starts at ON *command* time, but the press physically lands
      # at blip time — when the Press Listener flips cooling_active on.
      # With long blip latency the timer could already be idle at the flip,
      # making the min-run floor soft; so additionally require the belief
      # to have been 'on' for the post-on duration. No-op when no
      # off-cooldown timer is configured (preserves original behavior).
      - condition: template
        value_template: >-
          {{ off_cooldown_timer_id == ''
          or (now() - states[cooling_active_id].last_changed).total_seconds()
          >= (post_on_cooldown_minutes | int) * 60 }}
      - condition: template
        value_template: >-
          {{ temp_available and target_available
          and current_temp < (target - lower_offset) }}
      - condition: state
        entity_id: !input cooling_active
        state: "on"
    then:
      # Skip pressing while the slot is showing a blip or a '00' BLE drop.
      # NOTE: this does NOT detect a queued-but-undelivered press (the
      # sensor reads '01' while a command is in flight); the cooldown timer
      # is the real re-press throttle, so its duration must cover typical
      # blip latency (see cooldown_minutes).
      - if:
          - condition: template
            value_template: "{{ states(gateway_status_id) != '01' }}"
        then:
          - stop: Gateway not idle; skipping press
      # Press the AC power button via Fingerbot. Bookkeeping (cooling_active
      # + temp_at_toggle) is NOT written here: the Press Listener automation
      # toggles them when the status blip arrives, however late, so even a
      # duplicate press self-reports as two toggles instead of silently
      # corrupting the belief state. There is no in-run retry: with
      # unbounded blip latency a timeout cannot distinguish a lost press
      # from a late one, and a retry on a late press double-toggles. A
      # genuinely lost press is recovered by the outer loop (next evaluation
      # after cooldown still sees the temperature out of range and the
      # belief unchanged) and surfaced by the Drift Watchdog.
      - action: switch.toggle
        target:
          entity_id: !input gateway_switch
      # Start the cooldown: blocks the next ON press for the full duration
      # (compressor restart protection) and reconciliation until it expires.
      - action: timer.start
        target:
          entity_id: !input cooldown_timer
        data:
          duration:
            minutes: "{{ cooldown_minutes | int }}"
      # If a separate off-cooldown timer is configured, restart it with the
      # full cooldown duration: duplicate-OFF cover for late blips (the
      # off-gate must stay blocked as long as an OFF press may still be
      # queued at the gateway).
      - if:
          - condition: template
            value_template: "{{ off_cooldown_timer_id != '' }}"
        then:
          - action: timer.start
            target:
              entity_id: "{{ off_cooldown_timer_id }}"
            data:
              duration:
                minutes: "{{ cooldown_minutes | int }}"
      - stop: ""

mode: restart
