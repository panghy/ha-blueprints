blueprint:
  name: HVAC Drift Watchdog
  description: >-
    Detects the "impossible unless desynced" signature: the belief state says
    cooling is OFF while the room temperature is low enough to be explainable
    only by a stuck-on AC and is not recovering. All the wall AC units are
    set to 20°C, so a genuinely stuck-on AC drags the room toward ~20°C or
    below (every observed real desync pinned the room at 18-21.5°C); a room
    resting at 23°C under a raised setpoint is physically incompatible with
    a stuck-on AC and must never alert. Four gates must all pass:
    (1) temp >= drift_threshold below target, (2) temp at or below
    stuck_on_ceiling (just above the ACs' own setpoint), (3) temp not
    rising per the trend sensor — a stuck-on AC holds the room flat or
    falling, while a merely-cool room in a Hong Kong summer drifts upward —
    and (4) the target setpoint unchanged for setpoint_grace_minutes: right
    after a setpoint raise the room legitimately sits below the new target
    while the lagging trend window can still read not-rising, so alerts are
    deferred until the target has been stable; a real stuck-on AC persists
    for hours, so the grace only delays detection, never loses it.
    Fires a persistent notification plus a phone notification so a human can
    reconcile the room; throttles itself via a repeat-notify window to avoid
    spamming. Optional escalation inputs: a second phone notify service, iOS
    CRITICAL push (bypasses DND/silent), and a TTS announcement on a media
    player gated on an input_boolean (e.g. only while sleep mode is on).
  domain: automation
  source_url: https://github.com/panghy/ha-blueprints/blob/main/hvac_drift_watchdog.yaml
  input:
    temp_sensor:
      name: Temperature Sensor
      description: The room temperature sensor entity.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    target_temp:
      name: Target Temperature
      description: The input_number holding the desired room temperature.
      selector:
        entity:
          filter:
            - domain: input_number
    cooling_active:
      name: Cooling Active Boolean
      description: The input_boolean tracking whether we believe the AC is on.
      selector:
        entity:
          filter:
            - domain: input_boolean
    hvac_mode_select:
      name: HVAC Mode Selector
      description: The input_select for house HVAC mode (must include "Cooling").
      selector:
        entity:
          filter:
            - domain: input_select
    room_name:
      name: Room Name
      description: Human-readable room name used in notifications.
      selector:
        text:
    drift_threshold:
      name: Drift Threshold
      description: >-
        How far below target (°C) the room must be for the drift to count
        as impossible-without-cooling.
      default: 1.0
      selector:
        number:
          min: 0.5
          max: 3.0
          step: 0.1
          unit_of_measurement: "°C"
    stuck_on_ceiling:
      name: Stuck-On Temperature Ceiling
      description: >-
        Absolute room temperature (°C) at or below which a stuck-on AC is a
        plausible explanation. The wall AC units are set to 20°C, so a
        stuck-on AC drags the room toward ~20°C; every observed real desync
        pinned the room at 18-21.5°C. A room above this ceiling (e.g. 23°C
        under a raised setpoint) cannot be explained by a stuck-on AC and
        never alerts, regardless of how far below target it sits.
      default: 21.5
      selector:
        number:
          min: 18.0
          max: 24.0
          step: 0.1
          unit_of_measurement: "°C"
    temp_trend:
      name: Temperature Rising Trend Sensor
      description: >-
        A Trend helper binary_sensor over the room temperature sensor
        (recommended: sample_duration 1800s, min_gradient ~0.0001°C/s,
        min_samples 3, max_samples 120 — max_samples must be raised from its
        default of 2, both so min_samples fits and so the sample buffer
        actually spans the 30-min window on a frequently-updating sensor)
        that reads "on" while the temperature is rising. The watchdog only
        alerts while this sensor is "off": a stuck-on AC holds the room flat
        or falling, while a merely-cool room in a Hong Kong summer drifts
        upward. If the trend sensor is unknown/unavailable the alert is
        suppressed (fail-quiet). Trend state does not survive an HA restart:
        the sensor settles after a few source-sensor updates following a
        restart, so suppression after a restart is bounded by the
        temperature sensor's update cadence — acceptable because real
        desyncs last hours and the /5 trigger re-evaluates continuously.
      selector:
        entity:
          filter:
            - domain: binary_sensor
    setpoint_grace_minutes:
      name: Setpoint Change Grace Period
      description: >-
        Minimum minutes the target input_number must have been unchanged
        (any change in either direction arms the grace, raises and lowers
        alike) before an alert may fire. Right after a setpoint raise (wake
        routine, away-setback restore) the room legitimately sits below the
        new target while the 30-min trend window can lag the turn and still
        read not-rising — the observed false-positive boundary case. A
        genuinely stuck-on AC persists for hours, so this gate only delays
        detection, never loses it. Uses the input_number's last_changed
        directly (no helper needed); last_changed is preserved on
        same-value writes, so a script unconditionally re-writing an
        unchanged setpoint does NOT re-arm the grace — only real value
        changes do. After an HA restart the restored entity gets a fresh
        state write, so alerts are suppressed for up to one full grace
        period post-restart (fail-quiet, bounded). Values at or below the
        trend window length (30 min) leave little margin over the trend
        gate alone; the default of 45 is the window plus 50% margin.
      default: 45
      selector:
        number:
          min: 35
          max: 60
          step: 5
          unit_of_measurement: minutes
    drift_minutes:
      name: Drift Duration
      description: >-
        How long (minutes) cooling_active must have been off while the room
        stays below target before alerting.
      default: 20
      selector:
        number:
          min: 10
          max: 60
          step: 5
          unit_of_measurement: minutes
    renotify_minutes:
      name: Re-notify Interval
      description: Minimum minutes between repeat alerts for the same drift.
      default: 60
      selector:
        number:
          min: 15
          max: 240
          step: 15
          unit_of_measurement: minutes
    notify_service:
      name: Phone Notify Service
      description: >-
        The notify service name for the phone alert (e.g.
        notify.mobile_app_clements_iphone). The "notify." prefix is required.
      default: notify.mobile_app_clements_iphone
      selector:
        text:
    notify_service_2:
      name: Second Phone Notify Service (optional)
      description: >-
        Optional second notify service to alert as well (e.g.
        notify.mobile_app_grid). Empty string disables the second phone.
      default: ""
      selector:
        text:
    critical_push:
      name: iOS Critical Push
      description: >-
        Send the phone alerts as iOS CRITICAL notifications
        (push.sound.critical: 1, volume 0.7) so they bypass Do Not Disturb,
        Focus modes and the silent switch. Use for rooms where a desync must
        wake a sleeping human (e.g. the nursery). Off keeps the previous
        standard-push behavior.
      default: false
      selector:
        boolean:
    tts_media_player:
      name: TTS Announce Media Player (optional)
      description: >-
        Optional media_player entity to announce the alert on via
        tts.cloud_say (e.g. a bedroom HomePod). Empty string disables the
        announcement.
      default: ""
      selector:
        text:
    tts_gate:
      name: TTS Gate Boolean (optional)
      description: >-
        Optional input_boolean that must be "on" for the TTS announcement to
        play (e.g. input_boolean.sleep_mode, so the bedroom speaker only
        announces while adults are asleep and the phones would otherwise be
        silenced). Empty string announces unconditionally whenever a TTS
        media player is set.
      default: ""
      selector:
        text:

variables:
  temp_sensor_id: !input temp_sensor
  target_temp_id: !input target_temp
  cooling_active_id: !input cooling_active
  room_name: !input room_name
  drift_threshold: !input drift_threshold
  stuck_on_ceiling: !input stuck_on_ceiling
  temp_trend_id: !input temp_trend
  setpoint_grace_minutes: !input setpoint_grace_minutes
  renotify_minutes: !input renotify_minutes
  notify_service: !input notify_service
  notify_service_2: !input notify_service_2
  critical_push: !input critical_push
  tts_media_player: !input tts_media_player
  tts_gate: !input tts_gate
  # iOS companion-app critical push payload; {} keeps a standard push.
  push_data: >-
    {{ {'push': {'sound': {'name': 'default', 'critical': 1,
    'volume': 0.7}}} if critical_push else {} }}
  current_temp: "{{ states(temp_sensor_id) | float(99) }}"
  target: "{{ states(target_temp_id) | float(0) }}"
  temp_available: "{{ states(temp_sensor_id) not in ['unknown', 'unavailable'] }}"
  target_available: "{{ states(target_temp_id) not in ['unknown', 'unavailable'] }}"

triggers:
  - trigger: time_pattern
    minutes: /5

conditions:
  - condition: state
    entity_id: !input hvac_mode_select
    state:
      - Cooling
  # Belief has said "off" for the whole drift window...
  - condition: state
    entity_id: !input cooling_active
    state: "off"
    for:
      minutes: !input drift_minutes
  # ...yet the room is pinned well below target: impossible in summer
  # without active cooling.
  - condition: template
    value_template: >-
      {{ temp_available and target_available
      and current_temp <= (target - drift_threshold) }}
  # ...AND the room is cold enough for a stuck-on AC to be the explanation.
  # The wall units are set to 20°C: real desyncs pin the room at 18-21.5°C.
  # A room at 23°C under a raised setpoint (e.g. target 24/25) is below
  # target but physically incompatible with a stuck-on AC — never alert.
  - condition: template
    value_template: "{{ current_temp <= stuck_on_ceiling }}"
  # ...AND the temperature is not rising. A stuck-on AC holds the room flat
  # or falling; a merely-cool room in August drifts upward. Trend sensor
  # unknown/unavailable suppresses the alert (fail-quiet: real desyncs last
  # hours, a settled trend sensor still catches them).
  - condition: state
    entity_id: !input temp_trend
    state: "off"
  # ...AND the target setpoint has been unchanged for the grace period —
  # direction-agnostic: any value change (raise OR lower, e.g. an away
  # setback) arms the grace. The motivating case was a raise (07:00 wake
  # routine: nursery 21 -> 24) leaving the room below the new target near
  # the ceiling while the lagging 30-min trend window still read
  # not-rising. A real stuck-on AC persists for hours; deferring the alert
  # loses nothing. Same-value writes preserve last_changed and do not
  # re-arm; an HA restart writes the restored state fresh, suppressing for
  # up to one full grace period post-restart (fail-quiet, bounded). The
  # none-guard makes this self-contained rather than relying on the
  # target_available gate above.
  - condition: template
    value_template: >-
      {{ states[target_temp_id] is not none
      and (now() - states[target_temp_id].last_changed).total_seconds()
      >= setpoint_grace_minutes | float * 60 }}
  # Throttle: skip if this automation alerted recently.
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none
      or (now() - this.attributes.last_triggered).total_seconds()
      > (renotify_minutes | float * 60) }}

actions:
  - action: persistent_notification.create
    data:
      notification_id: "hvac_drift_{{ this.entity_id }}"
      title: "HVAC desync suspected: {{ room_name }}"
      message: >-
        {{ room_name }} is {{ current_temp }}°C, {{
        (target - current_temp) | round(1) }}°C below target {{ target }}°C,
        but cooling_active has been off for
        {{ ((now() - states[cooling_active_id].last_changed).total_seconds()
        / 60) | int }} minutes (trend: {{ states(temp_trend_id) }}, gradient
        {{ state_attr(temp_trend_id, 'gradient') }}).
        The AC is likely physically ON while HA believes it is OFF.
        Reconcile: check the room, press the AC power if needed, and make
        sure the cooling_active boolean matches reality.
  - action: "{{ notify_service }}"
    data:
      title: "HVAC desync suspected: {{ room_name }}"
      message: >-
        {{ room_name }}: {{ current_temp }}°C vs target {{ target }}°C with
        cooling believed OFF and temp not rising. AC probably stuck ON —
        needs a manual check.
      data: "{{ push_data }}"
  # Optional second phone (skipped when notify_service_2 is empty).
  - if:
      - condition: template
        value_template: "{{ notify_service_2 | trim != '' }}"
    then:
      - action: "{{ notify_service_2 | trim }}"
        data:
          title: "HVAC desync suspected: {{ room_name }}"
          message: >-
            {{ room_name }}: {{ current_temp }}°C vs target {{ target }}°C
            with cooling believed OFF and temp not rising. AC probably stuck
            ON — needs a manual check.
          data: "{{ push_data }}"
  # Optional TTS announcement, gated on the tts_gate boolean when set.
  - if:
      - condition: template
        value_template: >-
          {{ tts_media_player | trim != ''
          and (tts_gate | trim == '' or is_state(tts_gate | trim, 'on')) }}
    then:
      - action: tts.cloud_say
        data:
          cache: false
          entity_id: "{{ tts_media_player | trim }}"
          message: >-
            Attention: possible H V A C desync in the {{ room_name }}. The
            room is {{ current_temp }} degrees against a target of
            {{ target }}. The AC may be stuck on and needs a manual check.

mode: single
max_exceeded: silent
