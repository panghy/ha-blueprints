blueprint:
  name: HVAC Press Listener
  description: >-
    Run-independent ground truth for Fingerbot presses. The Adaprox gateway
    delivers press feedback ("blips") with unbounded latency — observed from
    6 seconds to over 8 minutes after the toggle command — so any bookkeeping
    tied to the lifetime of the pressing automation's run will eventually
    lose a late blip and desync the belief state. This listener reacts to
    every valid blip on the slot's status sensor, whenever it arrives and
    whatever caused it (thermostat loop, retry, manual app press), by
    toggling the cooling-active boolean and snapshotting the room
    temperature. One physical press produces a PAIR of blip values
    ~25-300ms apart (e.g. '0500000154000300' then '0500010154000300'), so a
    press is counted only on the transition from idle ('01'/'00') into a
    '0500...' value; the pair's second value transitions from another
    '0500...' value and is ignored. Idle flapping between '01' and '00'
    (BLE link drops) never matches. The 3rd byte of the blip is the
    Fingerbot's battery level in hex, not a slot ID — it drifts as the
    battery drains, so only the '0500' prefix is matched. After a press
    is booked, further bookings are suppressed for a refractory window
    (default 45 s): the gateway occasionally re-fires a stale blip value
    through a genuine '01' at the ~30 s revert-to-idle boundary, which
    would otherwise book a phantom press. Finally, a correlation gate
    (2026-09-09): a press-shaped blip books a press ONLY if the slot's
    gateway press switch changed state within correlation_seconds
    (default 720 since the 2026-09-09 widening; originally 60) before
    the blip — every commanded press path
    (thermostat loop, startup resync, manual HA/app press) actuates
    that switch first, while a gateway reconnect/state-refresh replay
    emits blips with no switch actuation at all (2026-09-09 05:58 HKT
    nursery incident: a reconnect-burst replay blip 2 h after the last
    real press booked a phantom and inverted the belief). Uncorrelated
    blips are never booked; each one writes a logbook entry so gateway
    hiccup frequency stays visible. A real blip arriving later than the
    window is a deliberate miss recovered by reconciliation/the drift
    watchdog (miss-tolerant, phantom-intolerant). Rejected-blip
    classification (2026-09-09, after two same-day inversions the gate
    left silent — living room 13:03 HKT, blip 121.7 s after its press;
    nursery 14:37 HKT, gateway disconnect delayed the blip ~9 min and
    belief stayed inverted ~4.5 h): a rejection is exactly the moment
    belief may have diverged, so the rejected path no longer fails
    silent. Each rejected blip is classified: SUSPICIOUS-LATE (the
    press switch actuated within Late Feedback Lookback seconds before
    the blip AND cooling_active has not been written since that
    actuation — the blip is almost certainly that press's only
    feedback, so the press landed physically but was never booked and
    belief is likely inverted) sends one immediate standard push via
    Alert Notify Service naming the listener, the blip, both
    timestamps and the delta; DUPLICATE-REFIRE (an actuation within
    the lookback but cooling_active was already written after it — the
    press's real feedback already booked, this is the known ~30 s
    stale re-fire) and PHANTOM (no actuation within the lookback — a
    gateway reconnect/state-refresh replay, the class the gate exists
    to reject; belief is fine) stay logbook-only and never page.
    Widened window + first-feedback accept guard (2026-09-09,
    Clement's ruling after the same two inversions): latency beyond
    60 s is chronic under gateway backlog, not anomalous — a 5.5-day
    replay (2026-09-04..09-09, all five rooms) measured ~37
    genuine-late first-feedback blips/day house-wide (deltas
    60-661 s), every one a real commanded press whose rejection left
    belief inverted — so late-but-genuine feedback is now ACCEPTED at
    the source. A blip books a press when the press switch actuated
    within Correlation Window seconds (default 720) AND
    cooling_active has NOT been written since that actuation
    (first-feedback-only guard: a press's first feedback books it,
    which makes every later duplicate/replay blip trailing that press
    reject — this is what makes the wide window safe). Duplicate
    re-fires and phantom replays stay rejected exactly as before; the
    SUSPICIOUS-LATE page now fires only for an unbooked blip beyond
    the widened window but inside the lookback, making it the rare
    genuine-anomaly signal (~0/day in the replay) instead of ~37/day
    noise.
  domain: automation
  source_url: https://github.com/panghy/ha-blueprints/blob/main/hvac_press_listener.yaml
  input:
    gateway_status:
      name: Gateway Status
      description: >-
        The Adaprox gateway's "Status" sensor for this Fingerbot's slot.
        Each slot's sensor only ever reports its own presses, so attribution
        is inherent.
      selector:
        entity:
          filter:
            - domain: sensor
    cooling_active:
      name: Cooling Active Boolean
      description: >-
        The input_boolean tracking whether the AC is on. Toggled on every
        confirmed physical press; this listener is its only writer in the
        press path. Its last_changed also arms the refractory window, so
        ANY writer (e.g. a reconciliation correction) suppresses press
        booking for refractory_seconds after it — a miss the
        reconciliation/watchdog recovers.
      selector:
        entity:
          filter:
            - domain: input_boolean
    temp_at_toggle:
      name: Temperature at Toggle
      description: >-
        An input_number snapshotting the room temperature when the press
        physically landed (blip time, not command time).
      selector:
        entity:
          filter:
            - domain: input_number
    temp_sensor:
      name: Temperature Sensor
      description: The room temperature sensor entity.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    refractory_seconds:
      name: Refractory Window
      description: >-
        Seconds after a booked press during which no further press is
        booked. The gateway can RE-FIRE a stale blip value through a
        genuine idle '01' at the ~30 s revert boundary (observed
        2026-08-29, ~31 s after the real pair), evading both the
        pair-staleness rule and the unknown/unavailable guard.
        Legitimate automation presses are >= 10 min apart (cooldown), so
        45 s only risks missing a manual press racing the window — a
        miss the reconciliation/watchdog recovers (the design is
        miss-tolerant, phantom-intolerant).
      default: 45
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: seconds
    gateway_switch:
      name: Gateway Press Switch
      description: >-
        The gateway's press switch for this Fingerbot's slot — the
        entity every commanded press actuates (the same entity as the
        toggle blueprint's Gateway Switch input). Used purely as a
        correlation reference; this listener never actuates it. A blip
        books a press only when this switch changed state within
        Correlation Window seconds before the blip. The switch holds
        toggle state (one state change per commanded press, no revert),
        so its last_changed is the time of the last press command. If
        the entity is missing/renamed the gate fails closed: nothing
        books, every blip logs as uncorrelated — a visible
        misconfiguration recovered by reconciliation/watchdog rather
        than a silent phantom source. Note an HA restart resets this
        switch's last_changed to startup time, leaving the gate open
        for one Correlation Window after every restart — restarts are
        also when the startup belief resync presses, so treat
        post-restart bookings with that in mind.
      selector:
        entity:
          filter:
            - domain: switch
    correlation_seconds:
      name: Correlation Window
      description: >-
        Seconds after a press-switch actuation during which a blip is
        accepted as that press's confirmation, subject to the
        first-feedback guard (no cooling_active write since the
        actuation). Widened 60 -> 720 on 2026-09-09 (Clement's
        ruling): observed command-to-blip latency is typically a few
        seconds to ~40 s, but under gateway backlog routinely runs
        minutes — a 5.5-day replay (2026-09-04..09-09, all five
        rooms) measured 205 genuine-late first-feedback blips (p50
        146 s, p95 515 s, max 660.7 s), every one a real commanded
        press whose rejection left belief inverted until
        reconciliation/the watchdog. 720 s is the smallest round
        window covering that entire observed distribution with
        margin (600 s would have missed the 660.7 s event). The old
        aliasing concern (a reconnect burst trailing a real press
        booking twice) is retired by the first-feedback guard: once
        a press's first feedback books, every later blip trailing
        that press rejects as duplicate-refire. Keep this below Late
        Feedback Lookback — blips beyond this window but inside the
        lookback are the suspicious-late page band.
      default: 720
      selector:
        number:
          min: 5
          max: 900
          step: 1
          unit_of_measurement: seconds
    late_lookback_seconds:
      name: Late Feedback Lookback
      description: >-
        Added 2026-09-09 (rejected-blip classification). Seconds after a
        press-switch actuation during which a REJECTED blip is treated
        as that press's suspiciously late feedback rather than a
        phantom. Command-to-blip latency beyond the 60 s window is
        common under gateway backlog (replayed 2026-09-06..09-09 across
        all five rooms: ~10-38 late first-feedback blips per day
        house-wide, deltas 60-550 s), and has historically reached
        8+ minutes (nursery 2026-09-09: 543.5 s after a gateway
        disconnect). A rejected blip with an actuation inside this
        lookback and no cooling_active write since that actuation means
        a commanded press physically landed but was never booked —
        belief is likely inverted. Beyond the lookback a rejected blip
        has no plausible commanding press and is classified a phantom
        replay (log-only). The default of 900 covers every observed
        genuine-late delta with margin. Since the 2026-09-09 window
        widening, blips inside the correlation window (default 720)
        with no booking since the actuation are ACCEPTED, so
        suspicious-late only fires in the band between the window and
        this lookback — the rare genuine-anomaly signal (~0/day in
        the 2026-09-04..09-09 replay). Keep this above Correlation
        Window or the page band vanishes.
      default: 900
      selector:
        number:
          min: 120
          max: 3600
          step: 30
          unit_of_measurement: seconds
    alert_notify_service:
      name: Alert Notify Service (suspicious-late rejections)
      description: >-
        Added 2026-09-09 (rejected-blip classification). Notify service
        for the one-shot push sent when a rejected blip is classified
        SUSPICIOUS-LATE (belief may be inverted; see the blueprint
        description). Standard push only — never an iOS critical
        notification (that escalation belongs to the drift watchdog).
        The default reuses the phone every room's drift watchdog
        already pages (notify.mobile_app_clements_iphone), so existing
        instances gain the alert without config edits. Empty string
        disables the push for this room; the classified logbook entry
        is always written regardless.
      default: notify.mobile_app_clements_iphone
      selector:
        text:

variables:
  temp_sensor_id: !input temp_sensor
  temp_at_toggle_id: !input temp_at_toggle
  cooling_active_id: !input cooling_active
  refractory_seconds: !input refractory_seconds
  gateway_switch_id: !input gateway_switch
  correlation_seconds: !input correlation_seconds
  late_lookback_seconds: !input late_lookback_seconds
  alert_notify_service: !input alert_notify_service

triggers:
  - trigger: state
    entity_id: !input gateway_status

conditions:
  # A press is the transition idle -> '0500...', or '0500...' -> '0500...'
  # when the previous blip value is stale (>2s old): one physical press
  # emits a pair of 0500 values 25-400ms apart, so a >2s gap means a
  # distinct press whose blip window abuts the previous one (queued
  # delivery). unknown/unavailable are deliberately NOT idle: a gateway
  # drop/restore around a lingering 0500 value would otherwise book a
  # phantom press; a blip genuinely lost in an availability gap is instead
  # recovered by reconciliation + the drift watchdog. '00'<->'01' idle
  # flapping never matches.
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none
      and trigger.from_state is not none
      and trigger.to_state.state.startswith('0500')
      and (
        trigger.from_state.state in ['01', '00']
        or (trigger.from_state.state.startswith('0500')
            and (trigger.to_state.last_changed
                 - trigger.from_state.last_changed).total_seconds() > 2)
      ) }}
  # Refractory window: the listener toggles cooling_active on every
  # booked press, so its last_changed doubles as the last-press
  # timestamp (no extra helper needed). A blip landing within
  # refractory_seconds of the previous booking is a duplicate gateway
  # re-fire, not a physical press. A non-existent/renamed boolean
  # entity (states[...] is none) does not suppress. Note last_changed
  # also resets on HA restart and on any other writer to the boolean —
  # both suppress for one window at most (miss-tolerant by design).
  - condition: template
    value_template: >-
      {{ states[cooling_active_id] is none
      or (now() - states[cooling_active_id].last_changed).total_seconds()
         > refractory_seconds }}

actions:
  # Correlation gate: a blip is only a press confirmation if a press was
  # actually commanded — i.e. the slot's press switch changed state within
  # correlation_seconds BEFORE the blip. Gateway reconnect/state-refresh
  # replays (2026-09-09 05:58 HKT nursery) emit press-shaped blips with no
  # switch actuation and must never book. Implemented as if/then/else (not
  # a condition) so the rejected path leaves a logbook trail. The bound is
  # one-sided (delta < window, no >= 0 floor): under queued mode a run can
  # start after a NEWER press command lands, making the delta negative for
  # the prior press's blip — still evidence of a commanded press, so it
  # books. A missing/renamed switch entity fails closed into the log path.
  # First-feedback guard (2026-09-09 widening): acceptance additionally
  # requires that cooling_active has NOT been written since the switch
  # actuation — the booking a press's first feedback writes makes every
  # later blip trailing that press (stale re-fire, reconnect replay)
  # reject as duplicate-refire, so widening the window cannot
  # double-book. A missing cooling_active entity does not block (same
  # stance as the refractory condition); belief corrections by other
  # writers (reconciliation) count as bookings and suppress acceptance
  # until the next commanded press — a miss the watchdog recovers
  # (miss-tolerant, phantom-intolerant, unchanged).
  - if:
      - condition: template
        value_template: >-
          {{ states[gateway_switch_id] is not none
          and (trigger.to_state.last_changed
               - states[gateway_switch_id].last_changed).total_seconds()
             < correlation_seconds
          and not (states[cooling_active_id] is not none
                   and states[cooling_active_id].last_changed
                       > states[gateway_switch_id].last_changed) }}
    then:
      # Snapshot first, then toggle: reconciliation compares against the
      # temperature at the moment the press landed.
      - action: input_number.set_value
        target:
          entity_id: !input temp_at_toggle
        data:
          value: >-
            {{ states(temp_sensor_id)
            | float(states(temp_at_toggle_id) | float(22)) }}
      - action: input_boolean.toggle
        target:
          entity_id: !input cooling_active
    else:
      # Rejected-blip classification (2026-09-09): a rejection is exactly
      # the moment belief may have diverged, so this path no longer fails
      # silent. One entry per ignored blip (the pair's second value never
      # reaches here — the pair-staleness condition drops it), and
      # cooling_active is untouched throughout.
      #   suspicious-late — the switch actuated within the lookback (but
      #     beyond the correlation window, or the accept gate would have
      #     booked it) AND cooling_active has not been written since that
      #     actuation: the rejected blip is almost certainly that press's
      #     only feedback, so the press landed physically but was never
      #     booked and belief is likely inverted. Since the 2026-09-09
      #     widening this is the rare genuine-anomaly band
      #     (window..lookback, default 720..900 s; ~0/day in the
      #     2026-09-04..09-09 replay — the incidents that motivated the
      #     class, living 121.7 s / nursery 543.5 s, are now ACCEPTED by
      #     the widened gate instead). Logbook + one standard push.
      #   duplicate-refire — an actuation within the lookback but
      #     cooling_active was written after it: the press's real feedback
      #     already booked (or another writer corrected belief), so this is
      #     the known ~30 s stale re-fire. Since the widening this also
      #     covers any delta below the window rejected by the
      #     first-feedback guard. Logbook only.
      #   phantom — no actuation within the lookback (or the switch entity
      #     is missing: fail closed, a visible misconfiguration): a
      #     reconnect/state-refresh replay, the class the gate exists to
      #     reject; belief is fine. Logbook only, never pages.
      # The accept gate books any delta < window with no booking since
      # the actuation, so a rejection here is booked-since
      # (duplicate-refire, any delta), beyond the window (suspicious-late
      # up to the lookback), or beyond the lookback / switch missing
      # (phantom).
      # Known residuals, accepted: a gateway re-fire ~30-45 s after an
      # UNBOOKED rejection repeats the suspicious push (a distinct
      # rejection event; 0 observed in the 2026-09-06..09-09 replay); a
      # non-listener cooling_active write between actuation and blip
      # classifies the rejection duplicate-refire and suppresses the push
      # (belief was just corrected — lower risk); an HA restart resets the
      # switch's last_changed, so a late blip within the lookback of a
      # restart can page against the startup resync press's actuation.
      - variables:
          reject_switch_missing: "{{ states[gateway_switch_id] is none }}"
          reject_delta: >-
            {{ 0 if reject_switch_missing
            else ((trigger.to_state.last_changed
                   - states[gateway_switch_id].last_changed)
                  .total_seconds() | round(1)) }}
          reject_booked_since: >-
            {{ not reject_switch_missing
            and states[cooling_active_id] is not none
            and states[cooling_active_id].last_changed
                > states[gateway_switch_id].last_changed }}
          reject_class: >-
            {{ 'phantom' if (reject_switch_missing
                             or reject_delta | float
                                >= late_lookback_seconds | float)
            else ('duplicate-refire' if reject_booked_since
                  else 'suspicious-late') }}
      - action: logbook.log
        data:
          name: "{{ this.attributes.friendly_name }}"
          entity_id: "{{ this.entity_id }}"
          message: >-
            {% set sw = states[gateway_switch_id] %} ignored uncorrelated
            press blip '{{ trigger.to_state.state }}' at
            {{ trigger.to_state.last_changed.isoformat() }} — press switch
            {{ gateway_switch_id }}
            {{ 'not found' if sw is none else 'last actuated ' ~
               reject_delta ~ ' s before the blip' }}
            (window {{ correlation_seconds }} s); no press booked;
            classified {{ reject_class }}
            {{- ' (no cooling_active write since the actuation — belief may
            be inverted; push sent)' if reject_class == 'suspicious-late'
               and alert_notify_service | trim != ''
            else ' (no cooling_active write since the actuation — belief
            may be inverted; push disabled)'
               if reject_class == 'suspicious-late'
            else ' (cooling_active already written since the actuation)'
               if reject_class == 'duplicate-refire'
            else ' (no commanded actuation within ' ~ late_lookback_seconds
               ~ ' s)' }}.
      - if:
          - condition: template
            value_template: >-
              {{ reject_class == 'suspicious-late'
              and alert_notify_service | trim != '' }}
        then:
          # Standard push only — never critical (that escalation belongs
          # to the drift watchdog). One push per rejection event.
          - action: "{{ alert_notify_service | trim }}"
            data:
              title: >-
                HVAC belief may be inverted:
                {{ this.attributes.friendly_name }}
              message: >-
                Press blip '{{ trigger.to_state.state }}' landed
                {{ reject_delta }} s after the last commanded actuation of
                {{ gateway_switch_id }} (actuated
                {{ states[gateway_switch_id].last_changed.isoformat() }},
                blip {{ trigger.to_state.last_changed.isoformat() }}) —
                outside the {{ correlation_seconds }} s window, and no
                press has been booked since the actuation. The press
                likely landed physically but was not counted, so cooling
                belief may be inverted. Check the unit and reconcile
                cooling_active if needed.

# Queued so that close-together triggers are evaluated in order rather
# than dropped; note the refractory window means only the first booking
# within refractory_seconds counts.
mode: queued
max: 10
