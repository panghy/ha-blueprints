blueprint:
  name: HVAC Recovering Toggle Thermostat
  description: >-
    Opt-in single-writer thermostat with automatic lost-command recovery.
    Missing feedback never requires a physical reset. Every command is one
    toggle press, so an unconfirmed press is never repeated on timeout alone:
    after at least 13 minutes it is retried only while the requested change is
    still needed AND temperature shows it did not happen (OFF: still falling,
    at least `retry_fall_evidence` below the command temperature; ON: still
    rising at least 0.5°C above it, or not cooler than it after 30 minutes).
    A command still unconfirmed after 60 minutes, while the room still needs
    the change, is retried: a working press shows its temperature response
    well within that time, so a pending command can never stall indefinitely.
    Working commands in this house showed up to 0.5°C residual cooling after
    OFF and up to 0.4°C start-up warming after ON (12–17 Oct 2026). A rebound from the post-command
    low confirms a pending OFF and a fall from the post-command peak confirms
    a pending ON, without another toggle. For ZHA, a matching unattributed
    switch report within 90 seconds is booked as a late acknowledgement.
    An acknowledgement proves only that the Fingerbot received the command,
    not that it pressed the button: if the room is at least 0.1°C warmer than
    at an acknowledged ON for 10 consecutive minutes, starting 30–45 minutes
    after the press, the estimate becomes OFF (`not_cooling`) and, while
    cooling is still needed, the toggle is pressed once more. The bounded
    window keeps a working AC that later falls behind (sun, capacity) from
    being second-guessed; the 10-minute hold rides out sensor source jumps.
    Replayed over 12–17 Oct 2026 this fired only on the dining room's failed
    presses; slow night-time cooling never triggered it.
    For ZHA, an unconfirmed ON whose switch has not changed at all since the
    command (the Fingerbot never responded, so no press happened) is retried
    at the 13-minute floor while cooling is needed and the room is no cooler
    than at the command. A believed ON is re-estimated OFF from warming only
    from 17 minutes after the press, so a slow-starting AC is not misread.
    Correct an idle estimate when sustained temperature drift contradicts it.
    Optional supply-vent probe (nursery, 22 Oct 2026): a fresh vent reading
    confirms a pending press (ON: 2.0°C colder than at the press; OFF: 1.0°C
    warmer) and flags an acknowledged press that did not change the AC (ON:
    under 0.5°C colder 6–30 minutes after the press; OFF: under 0.3°C warmer
    10–30 minutes after it). A flagged press is retried no sooner than the
    usual floors, at most once per hour from vent evidence; a probe that has
    not reported in the last 3 minutes, or was not fresh at the press, is
    ignored. Rooms without a probe are unchanged.

    This is an explicitly selected availability tradeoff. Feedback has no
    command identifier; late execution, lost feedback and ambient temperature
    changes can still produce wrong estimates or double toggles. Convergence
    and actual AC power state are not guaranteed by software observations.
    Keep existing temperature alerts and physically inspect persistent drift.

    Replace both the old thermostat and press listener with this one writer.
    Keep other automatic power writers, startup resync and gateway reconnect
    recovery disabled for the room. Commands and protection timers are recorded
    before actuation. Sensor/gateway outages hold commands temporarily and
    recover automatically; restart/reload/manual corrections do not latch a
    physical-verification lockout. No lockout notification or Connect pulse.
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    controller_entity:
      name: This automation's entity ID
      description: Must name this controller for run ownership checks.
      selector:
        entity:
          domain: automation
    lifecycle_marker:
      name: Independent restart and reload marker
      description: Use the triggered template sensor from the example package.
      selector:
        entity:
          domain: sensor
    temp_sensor:
      name: Room temperature
      selector:
        entity:
          domain: sensor
    raw_temp_sensor:
      name: Raw temperature probe (freshness)
      description: Use the source probe; retain the nursery's 35-minute freshness limit.
      selector:
        entity:
          domain: sensor
    target_temp:
      name: Target temperature
      selector:
        entity:
          domain: input_number
    cooling_active:
      name: Cooling belief
      selector:
        entity:
          domain: input_boolean
    temp_at_toggle:
      name: Temperature at belief update
      selector:
        entity:
          domain: input_number
    temp_at_off_press:
      name: Temperature at OFF command
      selector:
        entity:
          domain: input_number
    command_record:
      name: Command journal
      selector:
        entity:
          domain: input_text
    cooldown_timer:
      name: Shared cooldown timer
      selector:
        entity:
          domain: timer
    off_cooldown_timer:
      name: OFF cooldown timer
      selector:
        entity:
          domain: timer
    hvac_mode_select:
      name: House HVAC mode (Cooling)
      selector:
        entity:
          domain: input_select
    gateway_switch:
      name: Fingerbot power switch
      selector:
        entity:
          domain: switch
    command_transport:
      name: Fingerbot command transport
      description: >-
        Xiaomi BLE waits for gateway packets. ZHA CLICK books this run's intent
        only after its switch service returns successfully. Neither is proof of
        AC power. Leave other rooms on their existing transport.
      default: xiaomi_ble
      selector:
        select:
          options:
            - xiaomi_ble
            - zha_click
    fingerbot_mode:
      name: ZHA Fingerbot mode selector
      description: Required for zha_click; commands are held unless it reads CLICK.
      default: []
      selector:
        entity:
          domain: select
    gateway_status:
      name: Xiaomi BLE feedback sensor (unused for ZHA)
      default: []
      selector:
        entity:
          domain: sensor
    upper_offset:
      name: Start above target plus this offset
      default: 0.7
      selector:
        number:
          min: 0.1
          max: 2
          step: 0.1
    zha_min_off_minutes:
      name: Minimum OFF time after an acknowledged ZHA command
      description: >-
        Opt in to 5–13 minutes between an acknowledged OFF and the next ON.
        Only applies to zha_click. Failed/unacknowledged commands, adopted or
        temperature-derived estimates and BLE still require 13 minutes.
        The minimum ON time remains 5 minutes. Existing active timers are respected.
      default: 13
      selector:
        number:
          min: 5
          max: 13
          step: 1
          unit_of_measurement: min
    lower_offset:
      name: Stop below target minus this offset
      description: Negative values stop above target to allow for temperature sampling and residual cooling.
      default: -0.5
      selector:
        number:
          min: -2
          max: 2
          step: 0.1
    retry_fall_evidence:
      name: OFF retry evidence (continued fall)
      description: >-
        An unconfirmed OFF is pressed again only once the room is still at its
        lowest point and at least this far below the command temperature.
        Keep it above the room's normal residual cooling after a real OFF.
      default: 0.6
      selector:
        number:
          min: 0.3
          max: 2
          step: 0.1
          unit_of_measurement: °C
    vent_sensor:
      name: Supply-vent temperature probe (optional)
      description: Leave empty for rooms without a probe; every vent rule is then off.
      default: []
      selector:
        entity:
          domain: sensor
    vent_at_press:
      name: Vent temperature at the last press (required with a probe)
      description: input_number allowing -50; -50 marks "no fresh vent reading at the press".
      default: []
      selector:
        entity:
          domain: input_number
    vent_enabled:
      name: Vent evidence switch (optional)
      description: When set, vent evidence is used only while this input_boolean is on.
      default: []
      selector:
        entity:
          domain: input_boolean
    alert_notify_service:
      name: Existing standard notification service
      description: Compatibility input; this controller sends no lockout notices. Temperature/drift alerts stay separate.
      default: ""
      selector:
        text: {}

# These variables are immutable entity IDs only. State is read INSIDE actions,
# after acquiring the queue, so a queued trigger cannot reuse stale journal data.
variables:
  controller_id: !input controller_entity
  lifecycle_id: !input lifecycle_marker
  temp_id: !input temp_sensor
  raw_temp_id: !input raw_temp_sensor
  target_id: !input target_temp
  belief_id: !input cooling_active
  snapshot_id: !input temp_at_toggle
  off_snapshot_id: !input temp_at_off_press
  journal_id: !input command_record
  cooldown_id: !input cooldown_timer
  off_cooldown_id: !input off_cooldown_timer
  mode_id: !input hvac_mode_select
  switch_id: !input gateway_switch
  status_id: !input gateway_status
  transport: !input command_transport
  fingerbot_mode_id: !input fingerbot_mode
  upper: !input upper_offset
  lower: !input lower_offset
  zha_min_off: !input zha_min_off_minutes
  fall_evidence: !input retry_fall_evidence
  notify_service: !input alert_notify_service
  vent_id: !input vent_sensor
  vent_base_id: !input vent_at_press
  vent_switch_id: !input vent_enabled

triggers:
  - trigger: state
    entity_id: !input controller_entity
    to: 'on'
    id: activate
  - trigger: state
    entity_id: !input gateway_status
    to: null
    id: feedback
  - trigger: state
    entity_id: !input fingerbot_mode
    id: evaluate
  - trigger: state
    entity_id: !input vent_sensor
    to: null
    id: evaluate
  - trigger: state
    entity_id: !input gateway_switch
    to: null
    id: switch
  - trigger: state
    entity_id:
      - !input temp_sensor
      - !input raw_temp_sensor
      - !input lifecycle_marker
      - !input target_temp
      - !input cooling_active
      - !input temp_at_toggle
      - !input cooldown_timer
      - !input off_cooldown_timer
      - !input hvac_mode_select
    to: null
    id: evaluate
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input cooldown_timer
    id: evaluate
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input off_cooldown_timer
    id: evaluate
  - trigger: time_pattern
    seconds: /30
    id: evaluate
  - trigger: homeassistant
    event: start
    id: restart
  - trigger: event
    event_type: automation_reloaded
    id: restart

conditions: []
actions:
  # Read mutable state only after entering the queue. Changes to helpers or
  # lifecycle while a service yields abort that run, then reconcile next run.
  - variables:
      record: "{{ states(journal_id) | from_json({}) }}"
      restart_seconds: >-
        {{ (([5, ([zha_min_off | float(13), 13] | min)] | max) * 60) | int
           if transport == 'zha_click' else 780 }}
      clock: "{{ as_timestamp(now()) }}"
      temperature: "{{ states(temp_id) | float(none) }}"
      target: "{{ states(target_id) | float(none) }}"
      kind: "{{ trigger.id | default('evaluate') }}"
      generation: "{{ states(lifecycle_id) }}"
      activation: "{{ as_timestamp(states[controller_id].last_changed, 0) }}"
  - condition: template
    value_template: >-
      {{ controller_id == this.entity_id and is_state(controller_id, 'on')
         and generation not in ['', 'unknown', 'unavailable']
         and is_number(states(temp_id)) and is_number(states(target_id))
         and is_number(states(raw_temp_id))
         and 0 <= clock - as_timestamp(states[raw_temp_id].last_reported, 0) <= 2100
         and states(belief_id) in ['on', 'off'] and is_number(states(snapshot_id))
         and states(cooldown_id) in ['idle', 'active', 'paused']
         and states(off_cooldown_id) in ['idle', 'active', 'paused'] }}
  # Carry a guarded controller's known command age through an in-place handoff.
  # A pending ON has no stored command-temperature baseline in v1: start its
  # thermal observation at the current sample; never invent a historical value.
  - if: >-
      {{ record is mapping and record.get('v') == 1
         and record.get('phase') in ['verified', 'ready', 'pending']
         and record.get('expected') in ['on', 'off']
         and record.get('issued') is number and is_number(record.get('issued'))
         and record.get('booked') is number and is_number(record.get('booked'))
         and 0 <= record.issued <= clock and 0 < record.booked <= clock
         and (record.phase != 'pending' or record.issued >= record.booked)
         and as_timestamp(states[belief_id].last_reported) <= record.booked
         and as_timestamp(states[snapshot_id].last_reported) <= record.booked
         and states(belief_id) == (record.expected if record.phase != 'pending'
              else ('off' if record.expected == 'on' else 'on')) }}
    then:
      - action: input_text.set_value
        target:
          entity_id: !input command_record
        data:
          value: >-
            {{ {'v': 2, 'phase': 'pending' if record.phase == 'pending' else 'ready',
                'expected': record.expected, 'issued': record.issued, 'booked': record.booked,
                't': (states(off_snapshot_id) | float(temperature)
                       if record.phase == 'pending' and record.expected == 'off'
                       else temperature if record.phase == 'pending'
                       else states(snapshot_id) | float),
                'generation': generation, 'reason': 'migration'} | to_json }}
      - stop: Previous command carried forward; no actuation during migration
  - variables:
      valid: >-
        {{ record is mapping and record.get('v') == 2
           and record.get('phase') in ['ready', 'pending']
           and record.get('expected') in ['on', 'off']
           and record.get('issued') is number and is_number(record.get('issued'))
           and record.get('booked') is number and is_number(record.get('booked'))
           and record.get('t') is number and is_number(record.get('t')) and record.get('generation') is string
           and 0 <= record.issued <= clock and 0 < record.booked <= clock
           and (record.phase != 'pending' or record.issued >= record.booked) }}
      packet: >-
        {{ transport == 'xiaomi_ble' and kind == 'feedback' and trigger.to_state is not none
           and trigger.from_state is not none
           and trigger.to_state.state.startswith('0500')
           and (trigger.from_state.state in ['01', '00']
             or (trigger.from_state.state.startswith('0500')
               and (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() > 2)) }}
  - variables:
      corrected: >-
        {{ valid and (as_timestamp(states[belief_id].last_reported) > record.booked
            or as_timestamp(states[snapshot_id].last_reported) > record.booked
            or states(belief_id) != (record.expected if record.phase == 'ready'
                 else ('off' if record.expected == 'on' else 'on'))) }}
  # Invalid/restored records and external helper corrections recover by adopting
  # the current estimate, never claiming a new physical check. Fresh booking
  # imposes the normal protection interval. No helper is overwritten here.
  - if: "{{ not valid or corrected }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: !input command_record
        data:
          value: >-
            {{ {'v': 2, 'phase': 'ready', 'expected': states(belief_id),
                'issued': clock, 'booked': clock,
                't': states(snapshot_id) | float, 'generation': generation,
                'reason': 'estimate_adopted'} | to_json }}
      - stop: Estimate adopted; normal protection interval applies
  # Preserve an outstanding command and its original age across reloads.
  # This marker protects yielding runs; it is not a human-reset requirement.
  - if: "{{ record.generation != generation }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: !input command_record
        data:
          value: "{{ dict(record, generation=generation) | to_json }}"
      - stop: Lifecycle updated; reevaluate automatically
  # Track the post-command temperature extremes of an unconfirmed press. Retry
  # and confirmation compare against them, not only the command temperature.
  - variables:
      low: >-
        {{ ([record.get('lo') | float(record.t), record.t, temperature] | min) | round(2)
           if record.phase == 'pending' else record.t }}
      high: >-
        {{ ([record.get('hi') | float(record.t), record.t, temperature] | max) | round(2)
           if record.phase == 'pending' else record.t }}
      tracked: "{{ dict(record, lo=low, hi=high) | to_json }}"
  - if: >-
      {{ record.phase == 'pending' and tracked | length <= 255
         and (record.get('lo') != low or record.get('hi') != high) }}
    then:
      - action: input_text.set_value
        target:
          entity_id: !input command_record
        data:
          value: "{{ tracked }}"
  - variables:
      record: "{{ states(journal_id) | from_json({}) }}"
  - condition: template
    value_template: "{{ record.get('v') == 2 and record.get('phase') in ['ready', 'pending'] }}"
  - variables:
      low: "{{ record.get('lo') | float(record.t) if record.phase == 'pending' else record.t }}"
      # Acknowledged ON that never cooled: warmer than at the press, held for
      # 10 minutes, first seen 30–45 minutes after the press.
      warm_check: >-
        {{ record.phase == 'ready' and record.expected == 'on' and not packet
           and record.get('reason') in ['zigbee_ack', 'zigbee_late_ack', 'feedback']
           and 1800 <= clock - record.booked <= 3300 and clock - record.issued >= 1800
           and as_timestamp(states[raw_temp_id].last_reported) > record.booked }}
      warm: "{{ (temperature - record.t) | round(1) >= 0.1 }}"
      warm_since: "{{ record.get('w') | float(0) if record.phase == 'ready' else 0 }}"
  - if: >-
      {{ warm_check and ((warm and warm_since <= 0 and clock - record.booked <= 2700)
                         or (not warm and warm_since > 0)) }}
    then:
      - action: input_text.set_value
        target:
          entity_id: !input command_record
        data:
          value: "{{ dict(record, w=(clock | round(0) if warm else 0)) | to_json }}"
      - stop: Not-cooling observation updated; reevaluate on the next reading
  - variables:
      not_cooling: >-
        {{ warm_check and warm and warm_since > 0 and clock - warm_since >= 600
           and is_state(cooldown_id, 'idle') }}
      high: "{{ record.get('hi') | float(record.t) if record.phase == 'pending' else record.t }}"
      # A ZHA call can time out after the device has already pressed; its later
      # report has no automation context. Accept only the expected edge, soon.
      late_ack: >-
        {{ transport == 'zha_click' and kind == 'switch' and record.phase == 'pending'
           and is_state(fingerbot_mode_id, 'CLICK')
           and record.get('sw') in ['on', 'off']
           and trigger.to_state is not none and trigger.from_state is not none
           and trigger.from_state.state in ['on', 'off']
           and trigger.to_state.state == record.sw
           and trigger.from_state.state != record.sw
           and 0 <= as_timestamp(trigger.to_state.last_changed) - record.issued <= 90 }}
      # Supply-vent evidence for the current press. Only a probe that read
      # fresh at the press (base > -40, written after the journal) and has
      # reported within 3 minutes, after the press, can speak.
      vent_ok: >-
        {{ vent_id is string and vent_id != '' and vent_base_id is string and vent_base_id != ''
           and (vent_switch_id is not string or vent_switch_id == '' or is_state(vent_switch_id, 'on'))
           and is_number(states(vent_id)) and is_number(states(vent_base_id))
           and states(vent_base_id) | float > -40
           and as_timestamp(states[vent_base_id].last_reported, 0) >= record.issued
           and as_timestamp(states[vent_id].last_reported, 0) > record.issued + 30
           and clock - as_timestamp(states[vent_id].last_reported, 0) <= 180 }}
      vent_drop: "{{ (states(vent_base_id) | float(0) - states(vent_id) | float(0)) | round(2) if vent_ok else 0 }}"
      vent_quiet: "{{ clock - record.get('vx', 0) | float(0) > 3600 }}"
      vent_confirms: >-
        {{ vent_ok and record.phase == 'pending'
           and ((record.expected == 'on' and vent_drop >= 2.0)
             or (record.expected == 'off' and -vent_drop >= 1.0)) }}
      vent_not_cooling: >-
        {{ vent_ok and vent_quiet and record.phase == 'ready' and record.expected == 'on' and not packet
           and record.get('reason') in ['zigbee_ack', 'zigbee_late_ack', 'feedback']
           and 360 <= clock - record.issued <= 1800 and vent_drop < 0.5 }}
      vent_still_cooling: >-
        {{ vent_ok and vent_quiet and record.phase == 'ready' and record.expected == 'off' and not packet
           and record.get('reason') in ['zigbee_ack', 'zigbee_late_ack', 'feedback']
           and 600 <= clock - record.issued <= 1800 and -vent_drop < 0.3 }}
  - variables:
      booking: >-
        {% if record.phase == 'pending' and packet
           and record.issued <= as_timestamp(trigger.to_state.last_changed) %}
          {{ record.expected }}
        {% elif late_ack %}
          {{ record.expected }}
        {% elif vent_confirms %}
          {{ record.expected }}
        {% elif not_cooling or vent_not_cooling %}off
        {% elif vent_still_cooling %}on
        {% elif not packet and is_state(cooldown_id, 'idle')
           and clock - record.issued >= 780 and clock - record.booked >= 780 %}
          {% if record.phase == 'pending'
             and as_timestamp(states[raw_temp_id].last_reported) > record.issued %}
            {% if record.expected == 'on' and ((record.t - temperature) | round(1) >= 0.4
                 or (high - temperature) | round(1) >= 0.4) %}on
            {% elif record.expected == 'off' and ((temperature - record.t) | round(1) >= 0.2
                 or (temperature - low) | round(1) >= 0.2) %}off
            {% else %}{{ '' }}{% endif %}
          {% elif record.phase == 'ready' %}
            {% if record.expected == 'on' and clock - record.issued >= 1020
                 and clock - record.booked >= 1020
                 and (temperature - record.t) | round(1) >= 0.4 %}off
            {% elif record.expected == 'off' and (record.t - temperature) | round(1) >= 1.0 %}on
            {% else %}{{ '' }}{% endif %}
          {% else %}{{ '' }}{% endif %}
        {% else %}{{ '' }}{% endif %}
  - variables:
      booking_reason: >-
        {{ 'feedback' if packet else 'zigbee_late_ack' if late_ack
           else 'vent' if vent_confirms else 'not_cooling' if not_cooling
           else 'vent_not_cooling' if vent_not_cooling
           else 'vent_still_cooling' if vent_still_cooling else 'temperature' }}
  - if: "{{ booking | trim in ['on', 'off'] }}"
    then: &book_estimate
      - variables:
          snapshot_before: "{{ states(snapshot_id) | float(none) }}"
          snapshot_context_before: "{{ states[snapshot_id].context.id }}"
          snapshot_reported_before: "{{ as_timestamp(states[snapshot_id].last_reported) }}"
      # HA normalizes numeric state strings; tolerate representation noise only.
      # Context and report timestamps still detect same-value external writes.
      - if: "{{ (snapshot_before - temperature) | abs > 0.000001 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: !input temp_at_toggle
            data:
              value: "{{ temperature }}"
      - condition: template
        value_template: >-
          {{ is_number(states(snapshot_id))
             and (states(snapshot_id) | float - temperature) | abs <= 0.000001
             and is_state(controller_id, 'on')
             and as_timestamp(states[controller_id].last_changed) == activation
             and states(lifecycle_id) == generation
             and (((snapshot_before - temperature) | abs > 0.000001
                   and states[snapshot_id].context.id == context.id
                   and states[snapshot_id].last_reported == states[snapshot_id].last_updated)
               or ((snapshot_before - temperature) | abs <= 0.000001 and states[snapshot_id].context.id == snapshot_context_before
                   and as_timestamp(states[snapshot_id].last_reported) == snapshot_reported_before))
             and as_timestamp(states[belief_id].last_reported) <= record.booked
             and (states(journal_id) | from_json({})) == record }}
      - variables:
          snapshot_reported: "{{ as_timestamp(states[snapshot_id].last_reported) }}"
          snapshot_context: "{{ states[snapshot_id].context.id }}"
      - action: "{{ 'input_boolean.turn_' ~ (booking | trim) }}"
        target:
          entity_id: !input cooling_active
      - condition: template
        value_template: >-
          {{ states(belief_id) == booking | trim
             and is_state(controller_id, 'on')
             and as_timestamp(states[controller_id].last_changed) == activation
             and states(lifecycle_id) == generation
             and states[belief_id].context.id == context.id
             and states[belief_id].last_reported == states[belief_id].last_updated
             and states[snapshot_id].context.id == snapshot_context
             and as_timestamp(states[snapshot_id].last_reported) == snapshot_reported
             and (states(journal_id) | from_json({})) == record }}
      - action: input_text.set_value
        target:
          entity_id: !input command_record
        data:
          value: >-
            {% set vx = clock | round(0) if booking_reason in ['vent_not_cooling', 'vent_still_cooling']
               else record.get('vx') %}
            {{ dict({'v': 2, 'phase': 'ready', 'expected': booking | trim,
                'issued': record.issued, 'booked': as_timestamp(now()),
                't': temperature, 'generation': generation,
                'reason': booking_reason}, **({'vx': vx} if vx is number else {})) | to_json }}
      - stop: Estimate updated; never actuate in a feedback booking
  # Unsolicited and paired/replayed feedback never flips a ready estimate.
  - condition: template
    value_template: >-
      {{ not packet and is_state(mode_id, 'Cooling')
         and ((transport == 'xiaomi_ble' and is_state(status_id, '01'))
           or (transport == 'zha_click' and is_state(fingerbot_mode_id, 'CLICK'))) and states(switch_id) in ['on', 'off'] }}
  - variables:
      # The Fingerbot never reported any change after this command: no press
      # happened, so retrying cannot undo a landed press.
      no_response: >-
        {{ transport == 'zha_click' and record.phase == 'pending'
           and record.get('sw') in ['on', 'off'] and states(switch_id) in ['on', 'off']
           and states(switch_id) != record.sw
           and as_timestamp(states[switch_id].last_changed, 0) < record.issued }}
      off_wait: "{{ restart_seconds if transport == 'zha_click' and record.get('reason') == 'zigbee_ack' else 780 }}"
      # not_cooling follows 30+ minutes without cooling after the last press,
      # so the restart press needs only the normal floor from that press.
      booked_wait: "{{ 0 if record.get('reason') in ['not_cooling', 'vent_not_cooling'] else off_wait }}"
      # Thermal (vent) reconciliation of a press keeps the 13-minute floor from that press.
      on_wait: "{{ 780 if record.get('reason') in ['estimate_adopted', 'vent', 'vent_still_cooling'] else 300 }}"
  - variables:
      desired: >-
        {% if record.phase == 'pending' %}
          {% set age = clock - record.issued %}
          {% if age >= 780 and is_state(cooldown_id, 'idle')
             and is_state(off_cooldown_id, 'idle')
             and as_timestamp(states[raw_temp_id].last_reported) > record.issued
             and ((record.expected == 'on' and temperature > target + upper
                   and (((temperature - record.t) | round(1) >= 0.5 and (high - temperature) | round(1) <= 0)
                     or (no_response and (record.t - temperature) | round(1) < 0.1)
                     or (vent_ok and vent_quiet and vent_drop < 0.5)
                     or (age >= 1800 and (record.t - temperature) | round(1) < 0.2)
                     or age >= 3600))
               or (record.expected == 'off' and temperature < target - lower
                   and (((record.t - temperature) | round(1) >= fall_evidence | float(0.6)
                         and (temperature - low) | round(1) <= 0)
                     or (vent_ok and vent_quiet and -vent_drop < 0.3)
                     or age >= 3600))) %}
            {{ record.expected }}
          {% else %}{{ '' }}{% endif %}
        {% elif record.expected == 'off' and temperature > target + upper
           and is_state(cooldown_id, 'idle')
           and clock - record.booked >= booked_wait and clock - record.issued >= off_wait %}on
        {% elif record.expected == 'on' and temperature < target - lower
           and is_state(off_cooldown_id, 'idle')
           and clock - record.booked >= (780 if record.get('reason') == 'estimate_adopted' else 300)
           and clock - record.issued >= on_wait | int %}off
        {% else %}{{ '' }}{% endif %}
  - condition: template
    value_template: "{{ desired | trim in ['on', 'off'] }}"
  - variables:
      issued_at: "{{ as_timestamp(now()) }}"
      belief_before: "{{ states(belief_id) }}"
      switch_after: "{{ 'off' if is_state(switch_id, 'on') else 'on' }}"
  - action: input_text.set_value
    target:
      entity_id: !input command_record
    data:
      value: >-
        {{ dict({'v': 2, 'phase': 'pending', 'expected': desired | trim,
            'issued': issued_at, 'booked': record.booked,
            't': temperature, 'lo': temperature, 'hi': temperature, 'sw': switch_after,
            'generation': generation,
            'reason': 'retry' if record.phase == 'pending' else 'command'},
           **({'vx': record.vx} if record.get('vx') is number else {})) | to_json }}
  # Arm the cycle timers before the physical service. The journal separately
  # enforces the full 13-minute retry/reconciliation floor for uncertain calls,
  # even when the opt-in ZHA OFF timers expire earlier. Only a matching ZHA ACK
  # permits the shorter normal restart interval; never infer it from timer expiry.
  - action: timer.start
    target:
      entity_id: !input cooldown_timer
    data:
      duration: "{{ restart_seconds if desired | trim == 'off' else 780 }}"
  - action: timer.start
    target:
      entity_id: !input off_cooldown_timer
    data:
      duration: "{{ 300 if desired | trim == 'on' else restart_seconds }}"
  - if: "{{ desired | trim == 'off' }}"
    then:
      - action: input_number.set_value
        target:
          entity_id: !input temp_at_off_press
        data:
          value: "{{ temperature }}"
  # Vent reading at this press (written after the journal, so it belongs to it);
  # -50 when the probe is not fresh, which turns every vent rule off for this press.
  - if: "{{ vent_base_id is string and vent_base_id != '' }}"
    then:
      - action: input_number.set_value
        target:
          entity_id: "{{ vent_base_id }}"
        data:
          value: >-
            {{ states(vent_id) | float if vent_id is string and is_number(states(vent_id))
               and as_timestamp(now()) - as_timestamp(states[vent_id].last_reported, 0) <= 180 else -50 }}
  - condition: template
    value_template: >-
      {% set j = states(journal_id) | from_json({}) %}
      {{ j is mapping and j.get('phase') == 'pending'
         and j.get('issued') == issued_at and j.get('expected') == desired | trim
         and j.get('sw') == switch_after and states(switch_id) == ('on' if switch_after == 'off' else 'off')
         and j.get('generation') == generation and states(lifecycle_id) == generation
         and is_state(controller_id, 'on')
         and as_timestamp(states[controller_id].last_changed) == activation
         and is_state(mode_id, 'Cooling') and ((transport == 'xiaomi_ble' and is_state(status_id, '01'))
           or (transport == 'zha_click' and is_state(fingerbot_mode_id, 'CLICK')))
         and states(switch_id) in ['on', 'off']
         and is_state(cooldown_id, 'active') and is_state(off_cooldown_id, 'active')
         and states(belief_id) == belief_before
         and as_timestamp(states[belief_id].last_reported) <= record.booked
         and as_timestamp(states[snapshot_id].last_reported) <= record.booked
         and is_number(states(temp_id)) and is_number(states(target_id))
         and is_number(states(raw_temp_id))
         and 0 <= as_timestamp(now()) - as_timestamp(states[raw_temp_id].last_reported, 0) <= 2100
         and ((desired | trim == 'on' and states(temp_id) | float > states(target_id) | float + upper)
           or (desired | trim == 'off' and states(temp_id) | float < states(target_id) | float - lower)) }}
  - variables:
      pending_before: "{{ states(journal_id) | from_json({}) }}"
  # The ZHA switch implementation awaits the cluster SUCCESS response and raises
  # on failure. Do not continue_on_error: an uncertain call must remain pending.
  - action: switch.toggle
    target:
      entity_id: !input gateway_switch

  # Only this completed service can acknowledge a ZHA command. Restored state,
  # unrelated switch reports and old BLE packets never acknowledge it. Recheck
  # run ownership and external corrections across the yielding radio service.
  - condition: template
    value_template: >-
      {{ transport == 'zha_click'
         and states(switch_id) == switch_after
         and states[switch_id].context.id == context.id
         and as_timestamp(states[switch_id].last_updated) >= issued_at
         and (states(journal_id) | from_json({})) == pending_before
         and is_state(controller_id, 'on')
         and as_timestamp(states[controller_id].last_changed) == activation
         and states(lifecycle_id) == generation
         and is_state(fingerbot_mode_id, 'CLICK')
         and states(belief_id) == belief_before
         and as_timestamp(states[belief_id].last_reported) <= record.booked
         and as_timestamp(states[snapshot_id].last_reported) <= record.booked
         and is_number(states(temp_id)) }}
  - variables:
      record: "{{ states(journal_id) | from_json({}) }}"
      temperature: "{{ states(temp_id) | float }}"
      booking: "{{ desired | trim }}"
      booking_reason: zigbee_ack
  - if: "{{ true }}"
    then: *book_estimate

mode: queued
max: 25
max_exceeded: warning
